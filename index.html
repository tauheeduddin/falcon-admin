<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Falcon Engine - Admin Panel</title>
    <style>
        :root {
            --bg-color: #0F1014;
            --card-bg: #1A1C23;
            --text-main: #FFFFFF;
            --text-muted: #A0A0A0;
            --border-color: #333333;
            --btn-grey: #D3D3D3;
            --green: #4CAF50;
            --red: #FF5252;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 400px;
            padding: 15px; /* Size thoda chota kiya */
            position: relative;
        }

        /* ---------- LOGIN PAGE ---------- */
        #loginPage {
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 100vh;
        }

        .login-card {
            background: var(--card-bg);
            padding: 25px 20px; /* Padding kam ki */
            border-radius: 16px;
            border: 1px solid var(--border-color);
            text-align: center;
        }

        .login-card h2 {
            margin-bottom: 20px;
            letter-spacing: 2px;
            font-size: 20px; /* Size chota kiya */
        }

        input[type="text"], input[type="password"], input[type="number"] {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 15px;
            background: #000;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 15px;
            outline: none;
        }

        input:focus { border-color: var(--text-muted); }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: var(--btn-grey);
            color: #000;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            letter-spacing: 1px;
        }

        /* ---------- MAIN DASHBOARD ---------- */
        #mainPage {
            display: none; 
        }

        .header-card {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .header-icon {
            width: 35px;
            height: 35px;
            background: #2A2D36;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 12px;
            font-weight: bold;
            color: #FFD700;
        }

        .header-title h3 { font-size: 16px; }
        .header-title p { font-size: 11px; color: var(--text-muted); }

        /* Ek lamba Total Keys block */
        .stat-card-long {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .stat-card-long h1 { font-size: 36px; }
        .stat-card-long p { font-size: 14px; color: var(--text-muted); }

        .btn-generate {
            width: 100%;
            padding: 12px;
            background: var(--btn-grey);
            color: #000;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .btn-generate span { font-size: 11px; font-weight: normal; margin-top: 4px; color: #333;}

        h2.list-title { font-size: 18px; margin-bottom: 15px; display: flex; justify-content: space-between; }

        /* ---------- KEY LIST ---------- */
        .key-card {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            margin-bottom: 12px;
        }

        .key-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .key-name { font-size: 16px; font-weight: bold; }
        
        .status-badge {
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: bold;
        }
        .status-active { background: #1B331F; color: var(--green); }

        .key-details {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        .key-actions { display: flex; gap: 10px; }

        .action-btn {
            flex: 1;
            padding: 10px;
            background: transparent;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .action-btn.delete {
            color: var(--red);
            border-color: #441111;
        }

        /* ---------- GENERATE PAGE ---------- */
        #generatePage {
            display: none;
        }

        .back-btn {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 24px;
            margin-bottom: 15px;
            cursor: pointer;
            padding: 5px;
        }

        .gen-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
        }

        .gen-card h2 { font-size: 20px; margin-bottom: 5px; }
        .gen-card p { font-size: 13px; color: var(--text-muted); margin-bottom: 15px; }

        .gen-key-box {
            background: #0A0A0A;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
        }

        .gen-key-text {
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .duration-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .duration-btn {
            padding: 12px;
            background: #22252D;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }

        .duration-btn.active {
            background: #444;
            color: #fff;
            border-color: #666;
        }

        .label { font-size: 11px; color: var(--text-muted); margin-bottom: 5px; text-transform: uppercase; font-weight: bold;}

        /* Custom Toast Notification */
        #toast {
            visibility: hidden;
            min-width: 250px;
            background-color: #2A2D36;
            color: #fff;
            text-align: center;
            border-radius: 8px;
            padding: 12px;
            position: fixed;
            z-index: 1000;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 14px;
            box-shadow: 0px 4px 12px rgba(0,0,0,0.5);
            opacity: 0;
            transition: opacity 0.3s, bottom 0.3s;
        }

        #toast.show {
            visibility: visible;
            opacity: 1;
            bottom: 50px;
        }

    </style>
</head>
<body>

<div class="container">

    <!-- LOGIN PAGE -->
    <div id="loginPage">
        <div class="login-card">
            <h2>ADMIN PANEL</h2>
            <input type="text" id="adminUser" placeholder="Username">
            <input type="password" id="adminPass" placeholder="Password">
            <button class="btn-primary" onclick="login()">LOGIN</button>
        </div>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="mainPage">
        <div class="header-card">
            <div class="header-icon">F</div>
            <div class="header-title">
                <h3>FALCON ENGINE</h3>
                <p>TITANIUM EDITION</p>
            </div>
        </div>

        <!-- Ek lamba Total Keys block -->
        <div class="stat-card-long">
            <div>
                <h1 id="totalKeysCount">0</h1>
                <p>Total Keys</p>
            </div>
            <div style="font-size: 40px; color: #333;">#</div>
        </div>

        <button class="btn-generate" onclick="showGeneratePage()">
            + GENERATE KEYS
            <span>Create new access keys</span>
        </button>

        <h2 class="list-title">
            All Keys
            <span style="font-size: 13px; color: var(--text-muted); font-weight: normal; margin-top: 4px;" id="listCount">0 keys total</span>
        </h2>
        
        <div id="keysList">
            <!-- Keys yahan dynamically aayengi -->
        </div>
    </div>

    <!-- GENERATE PAGE -->
    <div id="generatePage">
        <!-- Back Button -->
        <button class="back-btn" onclick="showMainPage()">←</button>
        
        <div class="gen-card">
            <h2>GENERATE KEYS</h2>
            <p>Auto-generated random key</p>
            
            <div class="gen-key-box">
                <p class="label" style="text-align: left;">YOUR NEW KEY</p>
                <div class="gen-key-text" id="newKeyDisplay">XXXXX</div>
                <button class="action-btn" style="width: 100%; margin-top: 10px;" onclick="copyNewKey()">COPY KEY</button>
            </div>

            <p class="label">DEVICE LIMIT</p>
            <input type="number" id="deviceLimit" value="1" min="1" style="margin-bottom: 20px; padding: 10px;">

            <p class="label">KEY DURATION</p>
            <div class="duration-grid" id="durationGrid">
                <div class="duration-btn" onclick="selectDuration(this, '1 Hour')">1 HOUR</div>
                <div class="duration-btn" onclick="selectDuration(this, '1 Day')">1 DAY</div>
                <div class="duration-btn" onclick="selectDuration(this, '3 Days')">3 DAYS</div>
                <div class="duration-btn active" onclick="selectDuration(this, '7 Days')">7 DAYS</div>
                <div class="duration-btn" onclick="selectDuration(this, '15 Days')">15 DAYS</div>
                <div class="duration-btn" onclick="selectDuration(this, '1 Month')">1 MONTH</div>
                <div class="duration-btn" onclick="selectDuration(this, '2 Months')">2 MONTHS</div>
                <div class="duration-btn" onclick="selectDuration(this, '1 Year')">1 YEAR</div>
            </div>

            <button class="btn-primary" onclick="generateNewKey()">GENERATE NEW KEY</button>
        </div>
    </div>

    <!-- Custom Toast -->
    <div id="toast">Key Copied!</div>

</div>

<script>
    // Admin Credentials
    const ADMIN_USER = "FALCONBYTAUHEED";
    const ADMIN_PASS = "TAUHEEDRAZAQADRI";

    // Data Storage
    let allKeys = JSON.parse(localStorage.getItem('falconKeys')) || [];
    let generatedKey = "";
    let selectedDuration = "7 Days";

    // Initialize
    updateUI();

    function login() {
        const user = document.getElementById('adminUser').value;
        const pass = document.getElementById('adminPass').value;

        if (user === ADMIN_USER && pass === ADMIN_PASS) {
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('mainPage').style.display = 'block';
            updateUI();
        } else {
            showToast("Invalid Credentials!");
        }
    }

    function showGeneratePage() {
        document.getElementById('mainPage').style.display = 'none';
        document.getElementById('generatePage').style.display = 'block';
        generateRandomString();
    }

    function showMainPage() {
        document.getElementById('generatePage').style.display = 'none';
        document.getElementById('mainPage').style.display = 'block';
        updateUI();
    }

    function generateRandomString() {
        const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
        const numbers = "0123456789";
        
        let key = letters.charAt(Math.floor(Math.random() * letters.length));
        for (let i = 0; i < 4; i++) {
            key += numbers.charAt(Math.floor(Math.random() * numbers.length));
        }
        
        generatedKey = key;
        document.getElementById('newKeyDisplay').innerText = key;
    }

    function selectDuration(element, duration) {
        document.querySelectorAll('.duration-btn').forEach(btn => btn.classList.remove('active'));
        element.classList.add('active');
        selectedDuration = duration;
    }

    function copyNewKey() {
        navigator.clipboard.writeText(generatedKey);
        showToast("Key Copied!");
    }

    function generateNewKey() {
        const devLimit = document.getElementById('deviceLimit').value;
        
        const newKeyObj = {
            key: generatedKey,
            duration: selectedDuration,
            deviceLimit: devLimit,
            status: "ACTIVE",
            timestamp: new Date().getTime()
        };

        allKeys.unshift(newKeyObj); 
        localStorage.setItem('falconKeys', JSON.stringify(allKeys));
        
        showToast("Key Generated Successfully!");
        showMainPage();
    }

    function deleteKey(index) {
        // Direct delete karega bina confirm popup ke
        allKeys.splice(index, 1);
        localStorage.setItem('falconKeys', JSON.stringify(allKeys));
        updateUI();
        showToast("Key Deleted!");
    }

    function copyExistingKey(key) {
        navigator.clipboard.writeText(key);
        showToast("Copied: " + key);
    }

    function updateUI() {
        // Total keys update
        document.getElementById('totalKeysCount').innerText = allKeys.length;
        document.getElementById('listCount').innerText = allKeys.length + " keys total";

        const keysList = document.getElementById('keysList');
        keysList.innerHTML = "";

        // Sirf active keys filter
        const activeKeys = allKeys.filter(k => k.status === "ACTIVE");

        if (activeKeys.length === 0) {
            keysList.innerHTML = `<p style="color: var(--text-muted); text-align: center; margin-top: 20px; font-size: 14px;">No active keys found.</p>`;
            return;
        }

        // Active keys display
        activeKeys.forEach((item) => {
            // Find original index for deletion
            const originalIndex = allKeys.findIndex(k => k.key === item.key);
            
            const card = document.createElement('div');
            card.className = 'key-card';
            card.innerHTML = `
                <div class="key-header">
                    <div class="key-name">FALCON-${item.key}</div>
                    <div class="status-badge status-active">${item.status}</div>
                </div>
                <div class="key-details">Validity: ${item.duration} | Devices: ${item.deviceLimit}</div>
                <div class="key-actions">
                    <button class="action-btn" onclick="copyExistingKey('FALCON-${item.key}')">COPY</button>
                    <button class="action-btn delete" onclick="deleteKey(${originalIndex})">DELETE</button>
                </div>
            `;
            keysList.appendChild(card);
        });
    }

    // Custom Toast Logic
    function showToast(message) {
        const toast = document.getElementById("toast");
        toast.innerText = message;
        toast.className = "show";
        setTimeout(function(){ toast.className = toast.className.replace("show", ""); }, 2500);
    }
</script>

</body>
</html>
