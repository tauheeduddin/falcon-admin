<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Falcon Engine - Admin Panel</title>
    <style>
        :root {
            --bg-color: #0F1014;
            --card-bg: #1A1C23;
            --text-main: #FFFFFF;
            --text-muted: #A0A0A0;
            --border-color: #333333;
            --btn-grey: #D3D3D3;
            --green: #4CAF50;
            --red: #FF5252;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            position: relative;
        }

        /* ---------- LOGIN PAGE ---------- */
        #loginPage {
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 100vh;
        }

        .login-card {
            background: var(--card-bg);
            padding: 30px 20px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            text-align: center;
        }

        .login-card h2 {
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            background: #000;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 16px;
            outline: none;
        }

        input[type="text"]:focus, input[type="password"]:focus {
            border-color: var(--text-muted);
        }

        .btn-primary {
            width: 100%;
            padding: 15px;
            background: var(--btn-grey);
            color: #000;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            letter-spacing: 1px;
        }

        /* ---------- MAIN DASHBOARD ---------- */
        #mainPage {
            display: none; /* Hidden by default */
        }

        .header-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        .header-icon {
            width: 40px;
            height: 40px;
            background: #2A2D36;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            font-size: 20px;
        }

        .header-title h3 { font-size: 18px; }
        .header-title p { font-size: 12px; color: var(--text-muted); }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
        }

        .stat-card .icon { font-size: 20px; margin-bottom: 10px; color: var(--text-muted); }
        .stat-card h1 { font-size: 32px; margin-bottom: 5px; }
        .stat-card p { font-size: 12px; color: var(--text-muted); }

        .btn-generate {
            width: 100%;
            padding: 15px;
            background: var(--btn-grey);
            color: #000;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .btn-generate span { font-size: 12px; font-weight: normal; margin-top: 5px; color: #333;}

        .search-bar {
            width: 100%;
            padding: 15px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 25px;
            color: var(--text-main);
            margin-bottom: 15px;
        }

        .filter-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .filter-btn {
            flex: 1;
            padding: 10px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-muted);
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        .filter-btn.active {
            background: #333;
            color: var(--text-main);
            border-color: #555;
        }

        /* ---------- KEY LIST ---------- */
        .key-card {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            margin-bottom: 15px;
        }

        .key-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .key-name { font-size: 18px; font-weight: bold; }
        
        .status-badge {
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
        }
        .status-active { background: #1B331F; color: var(--green); }
        .status-expired { background: #331B1B; color: var(--red); }

        .key-details {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 15px;
        }

        .key-actions {
            display: flex;
            gap: 10px;
        }

        .action-btn {
            flex: 1;
            padding: 10px;
            background: transparent;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .action-btn.delete {
            color: var(--red);
            border-color: #441111;
        }

        /* ---------- GENERATE PAGE ---------- */
        #generatePage {
            display: none;
        }

        .back-btn {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 24px;
            margin-bottom: 20px;
            cursor: pointer;
        }

        .gen-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
        }

        .gen-key-box {
            background: #0A0A0A;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        .gen-key-text {
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 15px;
        }

        .duration-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .duration-btn {
            padding: 12px;
            background: #22252D;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-muted);
            font-weight: bold;
            cursor: pointer;
        }

        .duration-btn.active {
            background: #444;
            color: #fff;
            border-color: #666;
        }

        .label { font-size: 12px; color: var(--text-muted); margin-bottom: 5px; text-transform: uppercase; font-weight: bold;}

    </style>
</head>
<body>

<div class="container">

    <!-- LOGIN PAGE -->
    <div id="loginPage">
        <div class="login-card">
            <h2>ADMIN PANEL</h2>
            <input type="text" id="adminUser" placeholder="Username">
            <input type="password" id="adminPass" placeholder="Password">
            <button class="btn-primary" onclick="login()">LOGIN</button>
        </div>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="mainPage">
        <div class="header-card">
            <div class="header-icon">⚡</div>
            <div class="header-title">
                <h3>FALCON ENGINE</h3>
                <p>TITANIUM EDITION</p>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="icon">🔑</div>
                <h1 id="totalKeysCount">0</h1>
                <p>Total Keys</p>
            </div>
            <!-- Tune bola active ki jagah Total ka box, toh yahan ek aur box daal diya -->
            <div class="stat-card">
                <div class="icon">⚡</div>
                <h1 id="totalKeysCount2">0</h1>
                <p>Total Keys</p>
            </div>
        </div>

        <button class="btn-generate" onclick="showGeneratePage()">
            + GENERATE KEYS
            <span>Create new access keys</span>
        </button>

        <h2 style="margin-bottom: 10px;">All Keys <span style="font-size: 14px; color: var(--text-muted); float: right; margin-top: 8px;" id="listCount">0 keys total</span></h2>
        
        <input type="text" class="search-bar" placeholder="🔍 Search keys...">
        
        <div class="filter-buttons">
            <div class="filter-btn active">ALL</div>
            <div class="filter-btn">ACTIVE</div>
            <div class="filter-btn">EXPIRED</div>
        </div>

        <div id="keysList">
            <!-- Keys yahan dynamically aayengi -->
        </div>
    </div>

    <!-- GENERATE PAGE -->
    <div id="generatePage">
        <button class="back-btn" onclick="showMainPage()">←</button>
        
        <div class="gen-card">
            <h2 style="margin-bottom: 5px;">GENERATE KEYS</h2>
            <p style="font-size: 14px; color: var(--text-muted); margin-bottom: 15px;">Auto-generated random key</p>
            
            <div class="gen-key-box">
                <p class="label" style="text-align: left;">YOUR NEW KEY</p>
                <div class="gen-key-text" id="newKeyDisplay">XXXXX</div>
                <button class="action-btn" style="width: 100%; margin-top: 10px;" onclick="copyNewKey()">📋 COPY KEY</button>
            </div>

            <p class="label">DEVICE LIMIT</p>
            <input type="number" id="deviceLimit" value="1" min="1" style="margin-bottom: 20px;">

            <p class="label">KEY DURATION</p>
            <div class="duration-grid" id="durationGrid">
                <div class="duration-btn" onclick="selectDuration(this, '1 Hour')">1 HOUR</div>
                <div class="duration-btn" onclick="selectDuration(this, '1 Day')">1 DAY</div>
                <div class="duration-btn" onclick="selectDuration(this, '3 Days')">3 DAYS</div>
                <div class="duration-btn active" onclick="selectDuration(this, '7 Days')">7 DAYS</div>
                <div class="duration-btn" onclick="selectDuration(this, '15 Days')">15 DAYS</div>
                <div class="duration-btn" onclick="selectDuration(this, '1 Month')">1 MONTH</div>
                <div class="duration-btn" onclick="selectDuration(this, '2 Months')">2 MONTHS</div>
                <div class="duration-btn" onclick="selectDuration(this, '1 Year')">1 YEAR</div>
            </div>

            <button class="btn-primary" onclick="generateNewKey()">⚡ GENERATE NEW KEY</button>
        </div>
    </div>

</div>

<script>
    // Admin Credentials
    const ADMIN_USER = "FALCONBYTAUHEED";
    const ADMIN_PASS = "TAUHEEDRAZAQADRI";

    // Data Storage (Local Storage for now)
    let allKeys = JSON.parse(localStorage.getItem('falconKeys')) || [];
    let generatedKey = "";
    let selectedDuration = "7 Days";

    // Initialize
    updateUI();

    function login() {
        const user = document.getElementById('adminUser').value;
        const pass = document.getElementById('adminPass').value;

        if (user === ADMIN_USER && pass === ADMIN_PASS) {
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('mainPage').style.display = 'block';
            updateUI();
        } else {
            alert("Invalid Credentials!");
        }
    }

    function showGeneratePage() {
        document.getElementById('mainPage').style.display = 'none';
        document.getElementById('generatePage').style.display = 'block';
        generateRandomString();
    }

    function showMainPage() {
        document.getElementById('generatePage').style.display = 'none';
        document.getElementById('mainPage').style.display = 'block';
        updateUI();
    }

    function generateRandomString() {
        // Generate 5 char key: 1 Capital Letter + 4 Digits
        const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
        const numbers = "0123456789";
        
        let key = letters.charAt(Math.floor(Math.random() * letters.length));
        for (let i = 0; i < 4; i++) {
            key += numbers.charAt(Math.floor(Math.random() * numbers.length));
        }
        
        generatedKey = key;
        document.getElementById('newKeyDisplay').innerText = key;
    }

    function selectDuration(element, duration) {
        document.querySelectorAll('.duration-btn').forEach(btn => btn.classList.remove('active'));
        element.classList.add('active');
        selectedDuration = duration;
    }

    function copyNewKey() {
        navigator.clipboard.writeText(generatedKey);
        alert("Key Copied!");
    }

    function generateNewKey() {
        const devLimit = document.getElementById('deviceLimit').value;
        
        const newKeyObj = {
            key: generatedKey,
            duration: selectedDuration,
            deviceLimit: devLimit,
            status: "ACTIVE",
            timestamp: new Date().getTime()
        };

        allKeys.unshift(newKeyObj); // Add to top of list
        localStorage.setItem('falconKeys', JSON.stringify(allKeys));
        
        alert("Key Generated Successfully!");
        showMainPage();
    }

    function deleteKey(index) {
        if(confirm("Are you sure you want to delete this key?")) {
            allKeys.splice(index, 1);
            localStorage.setItem('falconKeys', JSON.stringify(allKeys));
            updateUI();
        }
    }

    function copyExistingKey(key) {
        navigator.clipboard.writeText(key);
        alert("Copied: " + key);
    }

    function updateUI() {
        // Update Total Keys Count
        document.getElementById('totalKeysCount').innerText = allKeys.length;
        document.getElementById('totalKeysCount2').innerText = allKeys.length;
        document.getElementById('listCount').innerText = allKeys.length + " keys total";

        const keysList = document.getElementById('keysList');
        keysList.innerHTML = "";

        if (allKeys.length === 0) {
            keysList.innerHTML = `<p style="color: var(--text-muted); text-align: center; margin-top: 20px;">No keys found.</p>`;
            return;
        }

        allKeys.forEach((item, index) => {
            const isExpired = item.status === "EXPIRED";
            
            const card = document.createElement('div');
            card.className = 'key-card';
            card.innerHTML = `
                <div class="key-header">
                    <div class="key-name">FALCON-${item.key}</div>
                    <div class="status-badge ${isExpired ? 'status-expired' : 'status-active'}">${item.status}</div>
                </div>
                <div class="key-details">Validity: ${item.duration} | Devices: ${item.deviceLimit}</div>
                <div class="key-actions">
                    <button class="action-btn" onclick="copyExistingKey('FALCON-${item.key}')">📋 COPY</button>
                    <button class="action-btn delete" onclick="deleteKey(${index})">🗑️ DELETE</button>
                </div>
            `;
            keysList.appendChild(card);
        });
    }
</script>

</body>
</html>
